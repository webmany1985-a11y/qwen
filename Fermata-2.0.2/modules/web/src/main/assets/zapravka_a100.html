<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Заправка А-100</title>
<!--
  Своя вкладка «Заправка» JARVIS Auto (пожелание 05.11.2026: «свою вкладку сделать для работы с заправкой а100,
  чтобы всё быстрее грузилось»). Без веб-Telegram: страница сама обращается к серверу приложения А-100
  (tgminiappback.a-100.by/api/v1, CORS «*» — проверено 05.11.2026). Запросы и поля — по коду приложения
  А-100 (tgminiapp.a-100.by, assets/index-*.js, 04–05.11.2026):
    POST /login {phone:"375XXXXXXXXX", password}  → data.plainTextToken (вход — номер и пароль вводит пользователь)
    GET  /azs                                       → data[]: NUMBER, NAME (адрес), POINT "широта,долгота", FUEL[]
    GET  /azs/{NUMBER}/pumps                        → data[]: номера колонок
    GET  /azs/{NUMBER}/pumps/{p}/ready              → data: nozzle_number, fuel_name, price (ошибка — колонка не активна)
    POST /fuel/calculate {liters, azs_number, nozzle_number, pump_number} → data: amount, liters
  Предупреждение «далеко от заправки» (>1 км) в приложении А-100 — своё, не сервера; здесь так же, решает человек.
  Оплата — этап 2 (пока — прежней вкладкой через Telegram).
  Вход хранится только в памяти этой страницы на телефоне (localStorage); в журнал ([JARVIS-ZP] fast:) не
  пишутся ни вход, ни номер телефона, ни суммы — только шаги, коды ответов и имена полей.
-->
<style>
html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden;font-family:"Roboto","DejaVu Sans",sans-serif;color:#fff;background:#0b0d10;-webkit-user-select:none;user-select:none}
#app *{box-sizing:border-box}
.z-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff 0,#f4f4f4 60%,#e9e9e9)}
.z-a100{height:min(50vh,230px);width:auto;animation:zpl 1.4s ease-in-out infinite}
.z-lt{position:absolute;bottom:6vh;left:0;right:0;text-align:center;color:#555;font-size:clamp(13px,4vh,17px)}
@keyframes zpl{50%{transform:scale(1.05);filter:drop-shadow(0 0 14px #7cc24288)}}
.z-ring{position:absolute;width:min(56vw,360px);height:min(56vw,360px);border-radius:50%;border:3px solid #7cc24233;border-top-color:#e3262b;animation:zrot 1.1s linear infinite}
@keyframes zrot{to{transform:rotate(360deg)}}
.z-bg{position:absolute;inset:-6px;background:url(zapravka_fon.jpg) center 30%/cover;animation:zkb 16s ease-in-out infinite alternate}
@keyframes zkb{to{transform:scale(1.025) translate(-4px,-2px)}}
.z-shade{position:absolute;inset:0;background:linear-gradient(180deg,#0000 0%,#0000 40%,#0005 62%,#000a 100%)}
.z-g{position:absolute;background:#0000002e;border:1.5px solid #ffffffaa;box-shadow:0 4px 18px #0007,inset 0 1px 0 #ffffff88;text-shadow:0 2px 8px #000c}
.z-hdr{left:2vw;top:3vh;border-radius:18px;padding:1.2vh 2vw 1.2vh 1.4vw;display:flex;align-items:center;gap:1.5vw;max-width:60vw}
.z-kl{width:clamp(30px,10vh,42px);height:auto;flex:none;filter:drop-shadow(0 0 6px #7cc24299)}
.z-st{font-size:clamp(18px,6.5vh,30px);font-weight:900;line-height:1.05}.z-ad{font-size:clamp(13px,4vh,18px);margin-top:3px}
.z-tag{right:2vw;top:3vh;border-radius:12px;padding:6px 10px;font-size:12px;background:#7cc24240;border-color:#7cc242}
.z-tag.far{background:#e3262b66;border-color:#ff9a9a}
.z-nav{right:2vw;top:calc(3vh + 36px);display:flex;gap:6px;background:none;border:0;box-shadow:none}
.z-nav .z-b{position:relative}
.z-b{border-radius:12px;padding:6px 12px;font-size:13px}
.z-fuel{display:inline-block;margin-top:4px;border-radius:9px;padding:2px 9px;font-size:clamp(12px,4vh,15px);font-weight:700;background:#f15a22b0;border:1px solid #ffd2bf}
.z-pumps{position:absolute;left:2vw;right:2vw;top:39vh;display:flex;gap:1vw}
.z-p{flex:1;max-width:24vw;height:17.5vh;min-height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,8.5vh,36px);font-weight:800;
background:#00000033;border:1.5px solid #ffffffaa;text-shadow:0 2px 8px #000c;box-shadow:0 4px 16px #0006;transition:transform .25s,background .25s}
.z-p.sel{background:#f15a22d0;border-color:#ffd2bf;box-shadow:0 0 26px #f15a22,0 6px 18px #0008;transform:translateY(-8px) scale(1.06)}
.z-p.wait{opacity:.6}
/* много колонок (в журнале 05.11.2026 — до 24): в машине два ряда помельче, на телефоне 6 в ряд */
.z-pumps.many{flex-wrap:wrap;top:39.5vh;gap:.8vh .6vw}
.z-pumps.many .z-p{flex:0 0 calc((100% - 11 * .6vw) / 12);height:10.5vh;min-height:30px;font-size:clamp(14px,6vh,26px);border-radius:10px}
.z-pumps.many .z-p.sel{transform:translateY(-3px) scale(1.04)}
.z-row{position:absolute;left:2vw;right:2vw;top:62.5vh;height:15.5vh;display:flex;gap:1vw}
.z-row .z-g{position:relative}
.z-seg{border-radius:14px;padding:0 2vw;display:flex;align-items:center;font-size:clamp(13px,4.2vh,17px)}.z-seg.on{background:#ffffffe0;color:#1f2a1f;font-weight:800;text-shadow:none}
.z-inp{flex:1;border-radius:16px;font-size:clamp(22px,11vh,44px);font-weight:800;display:flex;align-items:center;justify-content:flex-end;padding:0 2vw;background:#0000004d}
.z-inp small{font-size:18px;margin-left:6px}
.z-q{border-radius:14px;padding:0 1.2vw;min-width:7vw;justify-content:center;display:flex;align-items:center;font-size:clamp(12px,3.8vh,15px);background:#7cc24233;border-color:#7cc242}
.z-go{position:absolute;left:2vw;right:2vw;bottom:3vh;height:14vh;min-height:40px;border-radius:16px;background:linear-gradient(90deg,#f15a22e6,#ff7a3de6);border:1.5px solid #ffd2bf;
display:flex;align-items:center;justify-content:center;font-size:clamp(16px,5.5vh,22px);font-weight:900;letter-spacing:2px;box-shadow:0 6px 24px #f15a2299;transition:opacity .2s}
.z-go.off{opacity:.45;filter:grayscale(.6)}
.z-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,520px);border-radius:18px;padding:16px 18px;background:#141618f2;font-size:clamp(14px,4.5vh,18px);text-align:center;z-index:5}
.z-msg .z-mb{display:flex;gap:10px;margin-top:14px;justify-content:center}
.z-msg .z-b{position:relative;padding:10px 16px;font-size:15px}
.z-msg .z-b.pri{background:#f15a22d0;border-color:#ffd2bf}
.z-kbw{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:6}
.z-kb{position:relative;width:min(70vw,420px);border-radius:20px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#141618f2}
.z-kbd{grid-column:1/4;text-align:right;font-size:clamp(20px,9vh,36px);font-weight:800;padding:0 10px}
.z-k{height:clamp(32px,10vh,48px);border-radius:12px;border:1.5px solid #ffffff88;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,6vh,24px);font-weight:800;background:#2a2d31}
.z-ok{grid-column:1/4;background:#f15a22d0;border-color:#ffd2bf}
.z-login{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,460px);border-radius:20px;padding:14px 16px;background:#141618e6;display:flex;flex-direction:column;gap:9px}
.z-login h2{margin:0;font-size:clamp(16px,5vh,20px)}.z-login p{margin:0;font-size:13px;color:#ccc}
.z-login input{width:100%;font-size:18px;padding:9px 12px;border-radius:12px;border:1.5px solid #ffffff88;background:#0008;color:#fff;-webkit-user-select:text;user-select:text}
.z-login .z-b{position:relative;text-align:center;padding:10px;font-size:16px}
.z-login .z-b.pri{background:#f15a22d0;border-color:#ffd2bf;font-weight:800}
.z-err{color:#ff9a9a;font-size:14px;min-height:1em}
@media (orientation:landscape) and (max-height:420px){
.z-login{width:min(94vw,720px);display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:10px 14px}
.z-login h2,.z-login p,.z-err{grid-column:1/3}.z-login p{font-size:12px}
.z-login input{font-size:16px;padding:7px 10px}.z-login .z-b{padding:8px}}
@media (orientation:portrait){
.z-hdr{left:4vw;right:4vw;top:2vh;max-width:none;padding:1.4vh 4vw}
.z-st{font-size:clamp(20px,4vh,30px)}.z-ad{font-size:clamp(14px,2.4vh,18px)}
.z-tag{left:4vw;right:auto;top:calc(2vh + 15vh);font-size:13px}
.z-nav{right:4vw;top:calc(2vh + 15vh)}
.z-pumps{top:30vh;left:4vw;right:4vw;display:grid;grid-template-columns:repeat(4,1fr);gap:3vw}
.z-p{max-width:none;height:10vh;font-size:clamp(24px,5.5vh,40px)}
.z-pumps.many{grid-template-columns:repeat(6,1fr);gap:1.5vw;top:30vh}.z-pumps.many .z-p{height:6vh;font-size:clamp(18px,3.4vh,28px);flex:none}
.z-row{top:auto;bottom:calc(3vh + 9vh + 2vh);left:4vw;right:4vw;height:auto;display:grid;grid-template-columns:repeat(12,1fr);gap:2vw}
.z-row .z-seg{grid-column:span 6;height:7vh;justify-content:center;font-size:clamp(15px,2.4vh,19px)}
.z-row .z-inp{grid-column:span 12;height:10vh;font-size:clamp(30px,6vh,48px)}
.z-row .z-q{grid-column:span 3;height:7vh;justify-content:center;font-size:clamp(15px,2.4vh,19px)}
.z-go{left:4vw;right:26vw;bottom:3vh;height:9vh}
.z-kb{width:92vw}.z-k{height:8vh}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var API = 'https://tgminiappback.a-100.by/api/v1';
  var FAR_M = 1000;
  var app = document.getElementById('app');
  var log = function (m) { try { console.log('[JARVIS-ZP] fast: ' + m); } catch (e) { } };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
  };
  var tgUrl = (function () { try { return new URLSearchParams(location.search).get('tg') || ''; } catch (e) { return ''; } })();
  var t0 = Date.now();
  var since = function () { return ((Date.now() - t0) / 1000).toFixed(1) + ' s'; };

  // ------------------------------------------------------------------ сервер
  function Unauth() { this.name = 'Unauth'; }
  function ApiError(status, msg) { this.name = 'ApiError'; this.status = status; this.msg = msg; }
  var api = function (method, path, body, noAuth) {
    var h = { 'Accept': 'application/json' };
    var tok = store.get('a100_token');
    if (!noAuth) { if (!tok) return Promise.reject(new Unauth()); h['Authorization'] = 'Bearer ' + tok; }
    if (body) h['Content-Type'] = 'application/json';
    var ctl = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    return fetch(API + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined, signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        clearTimeout(to);
        return r.text().then(function (t) {
          var j = null; try { j = JSON.parse(t); } catch (e) { }
          if (r.status === 401 && !noAuth) { log(method + ' ' + path.replace(/\d+/g, 'N') + ' → 401'); store.set('a100_token', null); throw new Unauth(); }
          if (!r.ok) { log(method + ' ' + path.replace(/\d+/g, 'N') + ' → ' + r.status); throw new ApiError(r.status, (j && j.message) || ('ошибка сервера ' + r.status)); }
          return j || {};
        });
      }, function (e) { clearTimeout(to); log(method + ' ' + path.replace(/\d+/g, 'N') + ' → network ' + (e && e.name)); throw new ApiError(0, 'нет связи с сервером А-100'); });
  };
  var keys = function (o) { return o && typeof o === 'object' ? Object.keys(o).slice(0, 25).join(',') : typeof o; };

  // ------------------------------------------------------------------ расстояние
  var point = function (s) {
    var p = String((s && s.POINT) || '').split(','); var a = parseFloat(p[0]), b = parseFloat(p[1]);
    return isFinite(a) && isFinite(b) ? [a, b] : null;
  };
  var dist = function (a, b) {
    var R = 6371000, r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
    var x = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  };
  var km = function (m) { return m < 1000 ? Math.round(m) + ' м' : (m / 1000).toFixed(1).replace('.', ',') + ' км'; };

  // ------------------------------------------------------------------ состояние
  var st = { phase: 'load', loadText: 'Загрузка…', list: [], idx: 0, pos: null, pumps: [], pump: '', ready: null,
    mode: 'l', value: '', kb: false, calc: null, busy: false, msg: null, err: '' };
  var cur = function () { return st.list[st.idx] || null; };

  // ------------------------------------------------------------------ отрисовка
  function render() {
    if (st.phase === 'load') {
      app.innerHTML = '<div class="z-load"><img class="z-a100" alt="А-100" src="zapravka_logo.png"><div class="z-ring"></div><div class="z-lt">' + esc(st.loadText) + '</div></div>';
      return;
    }
    if (st.phase === 'login') { renderLogin(); return; }
    var s = cur(), d = s && s._d, far = d != null && d > FAR_M;
    var unit = st.mode === 'l' ? 'л' : 'руб';
    var quick = st.mode === 'l' ? ['5', '10', '15', '20'] : ['10', '20', '30', '40']; // пожелание 05.11.2026
    var can = st.pump && st.ready && parseFloat((st.value || '0').replace(',', '.')) > 0 && !st.busy;
    var goText = st.calc ? 'К ОПЛАТЕ ' + st.calc.amount + ' руб · ' + st.calc.liters + ' л' : (st.busy ? 'СЧИТАЮ…' : 'РАССЧИТАТЬ ›');
    app.innerHTML =
      '<div class="z-bg"></div><div class="z-shade"></div>' +
      '<div class="z-g z-hdr"><img class="z-kl" alt="" src="zapravka_klever.png"><div><div class="z-st">' +
      esc(s ? 'АЗС №' + s.NUMBER : 'АЗС не найдена') + '</div><div class="z-ad">' + esc(s ? (s.NAME || '') : 'нет списка станций') + '</div>' +
      (st.ready ? '<div class="z-fuel">' + esc(st.ready.fuel_name || 'топливо') + (parseFloat(st.ready.price) > 0 ? ' · ' + esc(Number(st.ready.price).toFixed(2).replace('.', ',')) + ' руб/л' : '') + '</div>' : '') +
      '</div></div>' +
      (d != null ? '<div class="z-g z-tag' + (far ? ' far' : '') + '">' + (far ? '⚠ далеко: ' : '✓ рядом: ') + km(d) + (st.posOld ? ' (по прошлому месту)' : '') + '</div>' :
        '<div class="z-g z-tag far">⚠ без местоположения</div>') +
      '<div class="z-g z-nav"><div class="z-g z-b" data-a="prev">‹</div><div class="z-g z-b" data-a="next">›</div><div class="z-g z-b" data-a="tg">Telegram</div></div>' +
      '<div class="z-pumps' + (st.pumps.length > 8 ? ' many' : '') + '">' + st.pumps.map(function (n) {
        var sel = String(n) === String(st.pump);
        return '<div class="z-p' + (sel ? ' sel' : '') + (sel && !st.ready ? ' wait' : '') + '" data-p="' + esc(n) + '">' + esc(n) + '</div>';
      }).join('') + (st.pumps.length ? '' : '<div class="z-g z-b" style="position:relative">' + (st.busy ? 'колонки…' : 'нет колонок') + '</div>') + '</div>' +
      '<div class="z-row"><div class="z-g z-seg' + (st.mode === 'l' ? ' on' : '') + '" data-m="l">Литры</div>' +
      '<div class="z-g z-seg' + (st.mode === 's' ? ' on' : '') + '" data-m="s">Сумма</div>' +
      '<div class="z-g z-inp" data-a="kb">' + esc(st.value || '0') + '<small>' + unit + '</small></div>' +
      quick.map(function (q) { return '<div class="z-g z-q" data-q="' + q + '">' + q + '</div>'; }).join('') + '</div>' +
      '<div class="z-go' + (can || st.calc ? '' : ' off') + '" data-a="go">' + esc(goText) + '</div>' +
      (st.kb ? keypad() : '') + (st.msg ? msgBox() : '');
  }
  function keypad() {
    var k = ['1', '2', '3', '4', '5', '6', '7', '8', '9', st.mode === 's' ? ',' : '', '0', '⌫'];
    return '<div class="z-kbw" data-a="kbclose"><div class="z-g z-kb"><div class="z-kbd">' + esc(st.value || '0') + ' ' + (st.mode === 'l' ? 'л' : 'руб') + '</div>' +
      k.map(function (x) { return x ? '<div class="z-k" data-k="' + x + '">' + x + '</div>' : '<div></div>'; }).join('') +
      '<div class="z-k z-ok" data-a="kbok">Готово</div></div></div>';
  }
  function msgBox() {
    var m = st.msg;
    return '<div class="z-msg">' + esc(m.text) + '<div class="z-mb">' + m.buttons.map(function (b, i) {
      return '<div class="z-g z-b' + (b.pri ? ' pri' : '') + '" data-mb="' + i + '">' + esc(b.label) + '</div>';
    }).join('') + '</div></div>';
  }
  function renderLogin() {
    app.innerHTML = '<div class="z-bg"></div><div class="z-shade"></div><form class="z-login" id="lf" autocomplete="on">' +
      '<h2>Вход в А-100</h2><p>Номер и пароль от приложения А-100. Вводятся один раз и хранятся только на этом телефоне.</p>' +
      '<input id="ph" type="tel" inputmode="tel" placeholder="+375 (29) 123 45 67" autocomplete="tel">' +
      '<input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">' +
      '<div class="z-err">' + esc(st.err) + '</div>' +
      '<button class="z-g z-b pri" type="submit">' + (st.busy ? 'Вхожу…' : 'Войти') + '</button>' +
      '<div class="z-g z-b" data-a="tg">Через Telegram</div></form>';
    var ph = document.getElementById('ph');
    if (st.ph) ph.value = st.ph; // номер не теряется при перерисовке (ошибка входа); пароль — набирается заново
    ph.oninput = function () { st.ph = ph.value; };
    document.getElementById('lf').onsubmit = function (e) { e.preventDefault(); login(); };
  }

  // ------------------------------------------------------------------ действия
  function digitsPhone(v) {
    var d = String(v || '').replace(/\D/g, '');
    if (d.length === 9) return '375' + d;
    if (d.length === 12 && d.indexOf('375') === 0) return d;
    if (d.length === 11 && d.indexOf('80') === 0) return '375' + d.slice(2);
    return null;
  }
  function login() {
    if (st.busy) return;
    st.ph = document.getElementById('ph').value;
    var ph = digitsPhone(st.ph), pw = document.getElementById('pw').value;
    if (!ph) { st.err = 'Номер: +375 и 9 цифр'; renderLogin(); return; }
    if (!pw) { st.err = 'Введите пароль'; renderLogin(); return; }
    st.busy = true; st.err = ''; renderLogin();
    log('login request');
    api('POST', '/login', { phone: ph, password: pw }, true).then(function (j) {
      var tok = j && j.data && j.data.plainTextToken;
      st.busy = false;
      if (!tok) { log('login: no token, keys ' + keys(j && j.data)); st.err = (j && j.message) || 'Сервер не выдал вход'; renderLogin(); return; }
      store.set('a100_token', tok);
      log('login ok');
      start();
    }, function (e) {
      st.busy = false;
      st.err = e && e.msg ? e.msg : 'Не удалось войти';
      renderLogin();
    });
  }
  function toTelegram() {
    if (!tgUrl) return;
    log('open via telegram');
    location.href = tgUrl;
  }
  function onAuthLost() {
    st.phase = 'login'; st.busy = false; st.err = 'Вход истёк или не выполнен — войдите снова';
    render();
  }

  // Список станций: из памяти сразу (меняется редко), с сервера — в фоне
  function loadStations() {
    var cached = null;
    try { cached = JSON.parse(store.get('a100_azs') || 'null'); } catch (e) { }
    var fresh = api('GET', '/azs').then(function (j) {
      var list = (j && j.data) || [];
      if (!Array.isArray(list)) { log('azs: data not a list, keys ' + keys(j)); list = []; }
      if (list[0]) log('azs: ' + list.length + ' stations, fields ' + keys(list[0]));
      var slim = list.filter(function (s) { return s.ACTIVE !== 'N' && s.ACTIVE !== false && s.ACTIVE !== 0; }) // закрытые станции не показываем
        .map(function (s) { return { NUMBER: s.NUMBER, NAME: s.NAME || s.NAME_RU, POINT: s.POINT }; }).filter(function (s) { return s.NUMBER != null; });
      if (slim.length) store.set('a100_azs', JSON.stringify({ t: Date.now(), list: slim }));
      return slim;
    });
    if (cached && cached.list && cached.list.length) { fresh.catch(function () { }); return Promise.resolve({ list: cached.list, fresh: fresh }); }
    return fresh.then(function (l) { return { list: l, fresh: null }; });
  }
  // Местоположение. Журнал 05.11.2026 10:09:51: телефон не ответил 8 с — станция показана через 9,3 с. Теперь:
  // свежее — до 1,5 с; нет — последнее сохранённое (не старше суток), а свежее, когда придёт, уточняет станцию
  var lastPos = function () {
    try { var o = JSON.parse(store.get('a100_pos') || 'null'); return o && Date.now() - o.t < 86400000 ? o.p : null; } catch (e) { return null; }
  };
  var fixPromise = null;
  function locate() {
    fixPromise = new Promise(function (res) {
      if (!navigator.geolocation) { res(null); return; }
      navigator.geolocation.getCurrentPosition(function (p) {
        var v = [p.coords.latitude, p.coords.longitude];
        store.set('a100_pos', JSON.stringify({ t: Date.now(), p: v }));
        res(v);
      }, function (e) { log('location error ' + (e && e.code)); res(null); }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 120000 });
    });
    return Promise.race([fixPromise, new Promise(function (r) { setTimeout(function () { r(undefined); }, 1500); })]).then(function (p) {
      if (p) return p;
      var lp = lastPos();
      if (lp) { st.posOld = true; log('location: using last known'); }
      return lp;
    });
  }
  function sortList(list) {
    list.forEach(function (s) { var p = point(s); s._d = st.pos && p ? dist(st.pos, p) : null; });
    if (st.pos) list.sort(function (a, b) { return (a._d == null ? 1e12 : a._d) - (b._d == null ? 1e12 : b._d); });
    return list;
  }
  function selectStation(i) {
    if (!st.list.length) return;
    st.idx = (i + st.list.length) % st.list.length;
    st.pumps = []; st.pump = ''; st.ready = null; st.calc = null; st.busy = true;
    render();
    var s = cur(), n = s.NUMBER, idx = st.idx;
    api('GET', '/azs/' + encodeURIComponent(n) + '/pumps').then(function (j) {
      if (idx !== st.idx) return;
      var p = (j && j.data) || [];
      if (!Array.isArray(p)) { log('pumps: not a list, keys ' + keys(j)); p = []; }
      var nums = []; p.forEach(function (x) { var v = typeof x === 'object' && x ? (x.number != null ? x.number : x.pump_number) : x; if (v != null && nums.indexOf(String(v)) < 0) nums.push(String(v)); });
      nums.sort(function (a, b) { return a - b; });
      st.pumps = nums; st.busy = false;
      log('station shown, pumps ' + nums.length + ', ' + since() + (s._d != null ? ', distance ' + (s._d > FAR_M ? 'far' : 'near') : ', no location'));
      render();
    }, fail);
  }
  function choosePump(p) {
    st.pump = p; st.ready = null; st.calc = null; render();
    var n = cur().NUMBER;
    api('GET', '/azs/' + encodeURIComponent(n) + '/pumps/' + encodeURIComponent(p) + '/ready').then(function (j) {
      if (st.pump !== p) return;
      var d = (j && j.data) || {};
      log('pump ready, fields ' + keys(d));
      st.ready = { nozzle: d.nozzle_number, fuel_name: d.fuel_name, price: d.price };
      render();
    }, function (e) {
      if (e instanceof Unauth) { onAuthLost(); return; }
      if (st.pump !== p) return;
      st.pump = '';
      showMsg('Колонка ' + p + ' сейчас не активна. Снимите пистолет нужного топлива и нажмите колонку ещё раз.' + (e && e.msg ? '\n(' + e.msg + ')' : ''), [{ label: 'Понятно', pri: true }]);
    });
  }
  function calculate() {
    var s = cur(), v = parseFloat((st.value || '0').replace(',', '.'));
    if (!s || !st.ready || !(v > 0)) return;
    var price = parseFloat(st.ready.price);
    var liters = st.mode === 'l' ? Math.floor(v) : (price > 0 ? Math.floor(v / price) : 0);
    if (!(liters > 0)) { showMsg('Сумма меньше цены одного литра.', [{ label: 'Понятно', pri: true }]); return; }
    var doIt = function () {
      st.busy = true; render();
      api('POST', '/fuel/calculate', { liters: liters, azs_number: s.NUMBER, nozzle_number: st.ready.nozzle, pump_number: Number(st.pump) }).then(function (j) {
        var d = (j && j.data) || {};
        log('calculate ok, fields ' + keys(d));
        st.busy = false;
        st.calc = { amount: d.amount != null ? Number(d.amount).toFixed(2).replace('.', ',') : '?', liters: d.liters != null ? parseInt(d.liters, 10) : liters };
        render();
      }, fail);
    };
    if (s._d != null && s._d > FAR_M) {
      showMsg('Судя по местоположению, вы в ' + km(s._d) + ' от АЗС №' + s.NUMBER + '. Заправляться здесь?',
        [{ label: 'Да, здесь', pri: true, fn: doIt }, { label: 'Другая АЗС', fn: function () { selectStation(st.idx + 1); } }]);
      return;
    }
    doIt();
  }
  function pay() {
    log('pay pressed (stage 2 not ready)');
    showMsg('Оплата из этой вкладки будет следующим шагом. Сейчас оплатить можно через приложение в Telegram — колонка ' + st.pump + ', ' + st.calc.liters + ' л.',
      [{ label: 'Открыть через Telegram', pri: true, fn: toTelegram }, { label: 'Назад' }]);
  }
  function showMsg(text, buttons) { st.msg = { text: text, buttons: buttons }; render(); }
  function fail(e) {
    st.busy = false;
    if (e instanceof Unauth) { onAuthLost(); return; }
    showMsg((e && e.msg) || 'Ошибка', [{ label: 'Повторить', pri: true, fn: function () { selectStation(st.idx); } }, { label: 'Telegram', fn: toTelegram }]);
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-p],[data-m],[data-q],[data-k],[data-a],[data-mb]');
    if (!el) return;
    var a = el.getAttribute('data-a');
    if (el.hasAttribute('data-mb')) {
      var b = st.msg && st.msg.buttons[+el.getAttribute('data-mb')];
      st.msg = null; render();
      if (b && b.fn) b.fn();
      return;
    }
    if (st.msg) return;
    if (a === 'tg') { toTelegram(); return; }
    if (st.phase !== 'main') return;
    if (el.hasAttribute('data-p')) { choosePump(el.getAttribute('data-p')); return; }
    if (el.hasAttribute('data-m')) { st.mode = el.getAttribute('data-m'); st.value = ''; st.calc = null; }
    else if (el.hasAttribute('data-q')) { st.value = el.getAttribute('data-q'); st.calc = null; }
    else if (el.hasAttribute('data-k')) {
      var k = el.getAttribute('data-k'), v = st.value || '';
      if (k === '⌫') v = v.slice(0, -1);
      else if (k === ',') { if (v.indexOf(',') < 0) v = (v || '0') + ','; }
      else if (v.replace(',', '').length < 5) v = (v === '0' ? '' : v) + k;
      st.value = v; st.calc = null;
    }
    else if (a === 'kb') { st.kb = true; }
    else if (a === 'kbok') { st.kb = false; }
    else if (a === 'kbclose') { if (e.target === el) st.kb = false; else return; }
    else if (a === 'prev') { selectStation(st.idx - 1); return; }
    else if (a === 'next') { selectStation(st.idx + 1); return; }
    else if (a === 'go') {
      if (el.classList.contains('off')) return;
      if (st.calc) { pay(); return; }
      calculate(); return;
    }
    render();
  });

  // ------------------------------------------------------------------ запуск
  function start() {
    if (!store.get('a100_token')) { log('no login yet, ' + since()); st.phase = 'login'; st.err = ''; render(); return; }
    st.phase = 'load'; st.loadText = 'Ищу ближайшую АЗС…'; render();
    var where = locate();
    loadStations().then(function (r) {
      return where.then(function (pos) {
        st.pos = pos;
        log('stations ' + r.list.length + (r.fresh ? ' (from memory)' : '') + ', location ' + (pos ? 'yes' : 'no') + ', ' + since());
        st.list = sortList(r.list.slice());
        st.phase = 'main';
        selectStation(0);
        // свежее местоположение пришло позже — пересчитать ближайшую, если колонку ещё не выбирали
        if (fixPromise) fixPromise.then(function (p) {
          if (!p || (pos && p[0] === pos[0] && p[1] === pos[1])) return;
          st.pos = p; st.posOld = false;
          var n = cur() && cur().NUMBER;
          st.list = sortList(st.list);
          log('location refined, ' + since());
          if (!st.pump && st.list[0] && String(st.list[0].NUMBER) !== String(n)) selectStation(0); else { st.idx = Math.max(0, st.list.findIndex(function (s) { return String(s.NUMBER) === String(n); })); render(); }
        });
        if (r.fresh) r.fresh.then(function (l) {
          if (!l.length || st.pump) return;
          var n = cur() && cur().NUMBER;
          st.list = sortList(l.slice());
          var i = st.list.findIndex(function (s) { return String(s.NUMBER) === String(n); });
          if (i >= 0) st.idx = i;
        }, function () { });
      });
    }).catch(function (e) {
      if (e instanceof Unauth) { onAuthLost(); return; }
      st.phase = 'main'; st.list = []; render();
      showMsg((e && e.msg) || 'Не удалось загрузить станции', [{ label: 'Повторить', pri: true, fn: start }, { label: 'Telegram', fn: toTelegram }]);
    });
  }
  log('page start');
  start();
})();
</script>
</body>
