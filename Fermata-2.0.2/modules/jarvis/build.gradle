android {
    namespace = "me.aap.fermata.addon.jarvis"
    defaultConfig {
        versionCode 1
        versionName "1.0"
    }

    // Сборка для машины жены (15.11.2026): -PEMBLEMA=buick — во вкладке JARVIS эмблема Buick вместо Opel.
    // Набор ресурсов выпускной сборки перекрывает одноимённый ресурс main (jarvis_opel_znachok); огонь тот же.
    // Ресурс приложения модуль jarvis не перекрывает: он отдельная часть пакета (bundletool: «different content»).
    // Рисунок свой, не логотип производителя: src/emblema-buick/narisovat.py.
    def emblema = project.getProperties().get('EMBLEMA')
    if (emblema != null) {
        sourceSets.release.res.srcDirs += "src/emblema-${emblema}/res"
    }
}


ext {
    addons = [
            [
                    name   : 'jarvis',
                    icon   : 'record_voice',
                    class  : 'me.aap.fermata.addon.jarvis.JarvisAddon',
                    order  : 1,
                    hasSettings: true,
                    enabled: true
            ]
    ]
}

dependencies {
    implementation project(':utils')
    implementation project(':fermata')
    implementation libs.androidMaterial
    implementation libs.androidxMedia
    // Распознавание ответов в диалоге заправки на телефоне, без интернета (решение 05.11.2026). Версия — та же,
    // что работает в JARVIS (android-team/prilozheniya/jarvis, app/build.gradle.kts)
    implementation 'com.alphacephei:vosk-android:0.3.75'
    // Настоящий org.json для тестов: в android.jar он заглушка (YandexHomeTest).
    // Версия — та же, что в тестах JARVIS (android-team), есть в Maven Central
    testImplementation 'org.json:json:20260814'
}
