android {
    namespace = "me.aap.fermata.addon.jarvis"
    defaultConfig {
        versionCode 1
        versionName "1.0"
    }
}


ext {
    addons = [
            [
                    name   : 'jarvis',
                    icon   : 'record_voice',
                    class  : 'me.aap.fermata.addon.jarvis.JarvisAddon',
                    order  : 1,
                    hasSettings: true,
                    enabled: true
            ]
    ]
}

dependencies {
    implementation project(':utils')
    implementation project(':fermata')
    implementation libs.androidMaterial
    implementation libs.androidxMedia
}
