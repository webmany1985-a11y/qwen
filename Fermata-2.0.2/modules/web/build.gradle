android {
    namespace = "me.aap.fermata.addon.web"
    defaultConfig {
        versionCode 1
        versionName "1.0"
    }
}

ext {
    addons = [
            [
                    name : 'youtube',
                    icon : 'youtube',
                    class: 'me.aap.fermata.addon.web.yt.YoutubeAddon',
                    order: 2
            ],
            [
                    name : 'tiktok',
                    icon : 'tiktok',
                    class: 'me.aap.fermata.addon.web.TikTokAddon',
                    order: 3
            ],
            [
                    name : 'kinopoisk',
                    icon : 'kinopoisk',
                    class: 'me.aap.fermata.addon.web.KinopoiskAddon',
                    order: 3
            ],
            [
                    name : 'zapravka',
                    icon : 'zapravka',
                    class: 'me.aap.fermata.addon.web.ZapravkaAddon',
                    order: 3
            ],
            [
                    name : 'video_sites',
                    icon : 'video_tab',
                    class: 'me.aap.fermata.addon.web.VideoSitesAddon',
                    order: 3
            ],
            [
                    name : 'web_browser',
                    icon : 'web',
                    class: 'me.aap.fermata.addon.web.WebBrowserAddon',
                    order: 3
            ]
    ]
    // Сборка жены (-PEMBLEMA=buick, 16.11.2026, Н5): вкладки TikTok нет — «толком не работает, зря место занимает».
    // Код дополнения остаётся (сборка пользователя его использует), в список вкладок жены оно не попадает.
    if (project.getProperties().get('EMBLEMA') == 'buick') {
        addons.removeIf { it.name == 'tiktok' }
    }
}

dependencies {
    implementation project(':utils')
    implementation project(':fermata')
    implementation libs.androidxMedia
    implementation libs.googlePlayFeatureDelivery
    implementation libs.androidxAppcompat
    implementation libs.androidMaterial
    implementation libs.androidxConstraintlayout
    implementation libs.androidxSwiperefreshlayout
    implementation libs.androidxWebkit
}
